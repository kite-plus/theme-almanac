# An example site that uses Almanac, for developing the theme and for its
# screenshot. themes/almanac links to the root of this repository.
site:
  title: Almanac
  description: 记录技术探索 · 项目 · 生活
  baseURL: http://localhost:1717
  language: zh-CN
  author: Your Name
  timezone: Asia/Shanghai

content:
  store: file
  dir: content
  # Projects, books and films each get a form in the studio, a page of
  # their own and a listing, which Almanac draws when the kinds are named
  # project, book and movie.
  types:
    - kind: project
      label: 项目
      dir: projects
      order: weight
      taxonomies: [tech]
      fields:
        - {key: cover, type: image, label: 截图, help: 项目页顶部的大图。}
        - {key: description, type: text, label: 一句话介绍, help: 留空时从 GitHub 取仓库的简介。}
        - {key: icon, type: image, label: Logo, help: 卡片上项目名旁边的小图标。}
        - key: state
          type: select
          label: 状态
          default: active
          options:
            - {value: active, label: 进行中}
            - {value: maintained, label: 维护中}
            - {value: experimental, label: 实验}
            - {value: archived, label: 已归档}
        - {key: repo, type: url, label: 仓库, placeholder: "https://github.com/you/project"}
        - {key: homepage, type: url, label: 官网}
        - {key: demo, type: url, label: Demo}
    - kind: book
      label: 书
      dir: books
      fields:
        - {key: cover, type: image, label: 封面}
        - {key: description, type: text, label: 一句话短评}
        - {key: author, type: string, label: 作者}
        - {key: rating, type: number, label: 评分, min: 0, max: 5, step: 1}
        - key: state
          type: select
          label: 状态
          default: finished
          options:
            - {value: reading, label: 在读}
            - {value: finished, label: 读过}
            - {value: wishlist, label: 想读}
            - {value: abandoned, label: 弃读}
        - {key: year, type: string, label: 出版年}
        - {key: link, type: url, label: 豆瓣链接, placeholder: "https://book.douban.com/subject/..."}
    - kind: movie
      label: 影
      dir: movies
      fields:
        - {key: cover, type: image, label: 海报}
        - {key: description, type: text, label: 一句话短评}
        - {key: director, type: string, label: 导演}
        - {key: rating, type: number, label: 评分, min: 0, max: 5, step: 1}
        - key: state
          type: select
          label: 状态
          default: watched
          options:
            - {value: watching, label: 在看}
            - {value: watched, label: 看过}
            - {value: wishlist, label: 想看}
            - {value: abandoned, label: 弃剧}
        - {key: year, type: string, label: 上映年}
        - {key: link, type: url, label: 豆瓣链接, placeholder: "https://movie.douban.com/subject/..."}

markdown:
  unsafeHTML: true

build:
  output: public
  pageSize: 10

theme:
  name: almanac
  settings:
    avatar: /images/avatar.svg
    position: 后端工程师
    location: 杭州
    status: 在职
    hero_title: 🎉 Hi，我是 Your Name
    hero_text: 后端工程师 · 喜欢用代码记录生活和构建产品。这里是我的数字花园 —— 记录技术探索、开源项目、阅读、影视和旅行。
    motto: 保持热爱，拒绝焦虑。
    banner: /images/banner.webp
    nav:
      - {label: 文章, url: /posts/}
      - {label: 项目, url: /projects/}
      - {label: 书影, url: /books/}
      - {label: 动态, url: /moments/}
      - {label: 关于, url: /about/}
      - {label: 友链, url: /links/}
      - {label: 简历, url: /resume/}
    social:
      - {platform: github, url: "https://github.com/yourname"}
      - {platform: x, url: "https://x.com/yourname"}
      - {platform: bilibili, url: "https://space.bilibili.com/1"}
      - {platform: wechat, qr: /images/wechat-qr.svg, account: yourname}
      - {platform: mail, url: "mailto:you@example.com"}
      - {platform: rss, url: /feed/}
    feed_page: /feed/
    resume_page: /resume/
    card_fallback: tile
    github_user: kite-plus
    github_list: stars
